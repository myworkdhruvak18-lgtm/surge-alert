<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<div style="width:390px;height:844px;box-sizing:border-box;background:#ffffff;font-family:Inter,Arial,sans-serif;color:#000000;padding:56px 18px 28px 18px;display:flex;flex-direction:column">
  <h1 style="margin:0 0 8px 0;font-size:28px;line-height:34px;font-weight:700">When do you usually leave?</h1>
  <p style="margin:0 0 22px 0;font-size:15px;line-height:21px;color:#545454">One time for each direction. You can change it later.</p>
  <div style="border:1px solid #e2e2e2;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px">
    <span style="font-size:13px;font-weight:600;color:#545454">To work</span>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:34px;font-weight:700">9:00 AM</span>
      <button type="button" style="height:36px;padding:0 14px;border:0;border-radius:999px;background:#f3f3f3;color:#000000;font:600 13px Inter,Arial,sans-serif">Change</button>
    </div>
    <span style="font-size:13px;color:#6b6b6b">Co-Living to Embassy Tech Village</span>
  </div>
  <div style="border:1px solid #e2e2e2;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:6px;margin-top:12px">
    <span style="font-size:13px;font-weight:600;color:#545454">Back home</span>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:34px;font-weight:700">6:30 PM</span>
      <button type="button" style="height:36px;padding:0 14px;border:0;border-radius:999px;background:#f3f3f3;color:#000000;font:600 13px Inter,Arial,sans-serif">Change</button>
    </div>
    <span style="font-size:13px;color:#6b6b6b">Embassy Tech Village to Co-Living</span>
  </div>
  <p style="margin:14px 0 0 0;font-size:13px;line-height:18px;color:#6b6b6b">Only one notification per direction per day, and none before 6:00 AM.</p>
  <div style="flex-grow:1"></div>
  <button type="button" style="height:52px;border:0;border-radius:8px;background:#000000;color:#ffffff;font:600 17px Inter,Arial,sans-serif">Continue</button>
</div>
</x-dc>
