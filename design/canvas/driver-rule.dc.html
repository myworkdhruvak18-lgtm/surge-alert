  <text x="330" y="258" font-size="15" font-weight="700" fill="#b0121f" font-family="Inter,Arial,sans-serif">Alternate pickup</text>
  <path d="M120 330 L40 330" stroke="#000000" stroke-width="3" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#000000"/></marker></defs>

  <div style="display:flex;gap:28px;margin-top:10px;font-size:14px;line-height:19px">
